name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run python -m pytest -q

      - name: Run Ruff
        run: uv run ruff check .

  container:
    name: Container build and healthcheck
    runs-on: ubuntu-latest
    needs: quality
    env:
      IMAGE_NAME: danwah-ci:${{ github.sha }}
      CONTAINER_NAME: danwah-ci-${{ github.run_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE_NAME" .

      - name: Start container
        run: |
          docker run -d --name "$CONTAINER_NAME" \
            -p 127.0.0.1:8199:8000 \
            -e APP_ENV=ci \
            -e APP_VERSION=ci \
            -e COMMIT_SHA="${{ github.sha }}" \
            "$IMAGE_NAME"

      - name: Wait for healthy container
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME")
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              docker logs "$CONTAINER_NAME"
              exit 1
            fi
            sleep 1
          done
          docker logs "$CONTAINER_NAME"
          exit 1

      - name: Verify HTTP contract
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8199/health
          response=$(curl --fail --silent --show-error http://127.0.0.1:8199/version)
          python3 - "$response" "${{ github.sha }}" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          expected_sha = sys.argv[2]
          assert payload["environment"] == "ci", payload
          assert payload["commit_sha"] == expected_sha, payload
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Show logs after failure
        if: failure()
        run: docker logs "$CONTAINER_NAME" || true

      - name: Remove test container
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
