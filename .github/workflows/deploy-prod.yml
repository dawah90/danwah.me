name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to deploy, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve existing release image
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              printf 'Version must look like v0.1.0.\n' >&2
              exit 2
              ;;
          esac
          git fetch --force --tags origin
          commit_sha=$(git rev-list -n 1 "$VERSION")
          if [ -z "$commit_sha" ]; then
            printf 'Release tag %s does not exist.\n' "$VERSION" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            printf 'Release tag must point to a commit on main.\n' >&2
            exit 1
          fi
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published image digest
        id: image
        env:
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          image_tag="ghcr.io/dawah90/danwah.me:sha-$COMMIT_SHA"
          docker pull "$image_tag"
          repository_digest=$(docker image inspect \
            --format '{{index .RepoDigests 0}}' "$image_tag")
          digest=${repository_digest#*@}
          case "$digest" in
            sha256:*) ;;
            *)
              printf 'Could not resolve an immutable image digest.\n' >&2
              exit 1
              ;;
          esac
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production release
    needs: resolve
    runs-on:
      - self-hosted
      - Linux
      - X64
      - danwah-deploy
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out released deployment scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy release digest
        env:
          APP_VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
          IMAGE_DIGEST: ${{ needs.resolve.outputs.digest }}
        run: |
          ./scripts/deploy.sh \
            prod \
            "ghcr.io/dawah90/danwah.me@$IMAGE_DIGEST" \
            "$APP_VERSION" \
            "$COMMIT_SHA"

      - name: Verify public production endpoint
        env:
          APP_VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          response=$(curl --fail --silent --show-error \
            https://prod.danwah.me/version)
          python3 - "$response" "$APP_VERSION" "$COMMIT_SHA" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          expected_version = sys.argv[2]
          expected_sha = sys.argv[3]
          assert payload["environment"] == "prod", payload
          assert payload["version"] == expected_version, payload
          assert payload["commit_sha"] == expected_sha, payload
          print(json.dumps(payload, sort_keys=True))
          PY
